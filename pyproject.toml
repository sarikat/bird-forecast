[project]
name = "bird-forecast"
version = "0.1.0"
description = "Nightly bird-collision risk forecast for Chicago migration seasons"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
